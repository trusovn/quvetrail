name: Foundation verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Create local configuration
        run: cp .env.example .env

      - name: Run the canonical full gate
        run: pnpm verify

      - name: Capture Compose logs after failure
        if: failure()
        run: docker compose logs --no-color > compose.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: foundation-failure-evidence
          if-no-files-found: ignore
          path: |
            compose.log
            playwright-report/
            test-results/

      - name: Ensure Compose cleanup
        if: always()
        run: docker compose down
